@page { size: A4; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #fff; }
body {
  font-family: "Quicksand", sans-serif;
  color: #5a3a46;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.page {
  width: 210mm; height: 297mm;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6mm;
}
.cut { padding: 4mm; border: 1px dashed #d9a3b5; border-radius: 6mm; position: relative; }
.cut::before { content: "✂"; position: absolute; top: -3.2mm; left: 8mm; font-size: 4.5mm; color: #d9a3b5; background: #fff; padding: 0 1mm; }
.card {
  width: 105mm; height: 148mm;
  border-radius: 5mm;
  background: radial-gradient(circle at 50% 25%, #ffeef3, #ffcfdc);
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: center;
  padding: 11mm 9mm 9mm;
  text-align: center;
}
.deco { position: absolute; font-size: 6mm; opacity: .55; }
.envelope { font-size: 13mm; line-height: 1; }
h1 {
  font-family: "Dancing Script", cursive; font-weight: 700;
  font-size: 11mm; line-height: 1.05;
  color: #d6457a;
  margin: 3mm 0 5mm;
}
.qr {
  width: 54mm; height: 54mm;
  padding: 4mm;
  background: #fff;
  border-radius: 4mm;
  box-shadow: 0 1.5mm 4mm rgba(214, 69, 122, .25);
}
.qr svg { width: 100%; height: 100%; display: block; }
.how { margin-top: 5mm; font-size: 3.6mm; font-weight: 600; color: #8a5a6b; }
.sign {
  margin-top: auto;
  font-family: "Dancing Script", cursive; font-weight: 700;
  font-size: 6.5mm; color: #d6457a;
}
.tip { font-size: 3mm; color: #b48a99; }
@media screen { body { background: #f3e6ea; } .page { margin: 0 auto; background: #fff; } }
</style>
</head>
